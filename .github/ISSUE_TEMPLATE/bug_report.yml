name: Bug report
description: Report a reproducible defect using synthetic data only
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Do not attach real resumes, profiles, decisions, databases, credentials,
        employer correspondence, generated documents, or screenshots containing them.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I used only synthetic or fully redacted data in this report.
          required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide the smallest reproducible example using files under examples/.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python, Node.js, and npm versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      render: shell
