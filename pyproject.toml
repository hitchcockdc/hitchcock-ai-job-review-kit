[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "get-a-job"
version = "0.1.0"
description = "A human-in-the-loop agent for finding and ranking newly posted jobs."
requires-python = ">=3.11"
dependencies = ["certifi>=2026.0.0"]

[project.scripts]
get-a-job = "get_a_job.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
